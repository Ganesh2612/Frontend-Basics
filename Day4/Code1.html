<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Arrays</h2>

<p>Array indexes are zero-based, which means the first item is [0].</p>

<p id="demo"></p>

<script>
const cars = ["Saab","Volvo","BMW"];
let ans="";
let n=0;
while(cars.length>n){
ans+=cars[n];
if(n==cars.length-1){

ans+=".";
}
else{
ans+=", "; 
}
n++;
}

document.getElementById("demo").innerHTML = ans;
</script>

</body>
</html>
